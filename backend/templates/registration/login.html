{% load static %}

<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>

TRIP

</title>

<link
rel="icon"
href="{% static 'favicon.ico' %}">

<link
rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

<link
rel="stylesheet"
href="{% static 'css/login.css' %}">

</head>

<body>

<div class="background"></div>

<div class="login-card">

<div class="logo">

<img
src="{% static 'images/logo-villageinsight.png' %}"
alt="VillageInsight DSS">

<h1>

TRIP

</h1>

<p>

Tourism Resource Integration Platform

</p>

</div>

<form method="post">

{% csrf_token %}

<div class="field">

<label>

Username

</label>

<div class="input-box">

<i class="fa-solid fa-user"></i>

{{ form.username }}

</div>

</div>

<div class="field">

<label>

Password

</label>

<div class="input-box">

<i class="fa-solid fa-lock"></i>

{{ form.password }}

<button
type="button"
id="showPassword">

<i class="fa-solid fa-eye"></i>

</button>

</div>

</div>

{% if form.errors %}

<div class="error">

<i class="fa-solid fa-circle-exclamation"></i>

Username atau Password salah.

</div>

{% endif %}

<button
type="submit"
class="login-btn">

<i class="fa-solid fa-right-to-bracket"></i>

Masuk ke Dashboard

</button>

</form>

<footer>

Department of Statistics

<br>

Universitas Brawijaya

<span>

© 2026 VillageInsight DSS

</span>

</footer>

</div>

<script src="{% static 'js/login.js' %}"></script>

</body>

</html>
