{% extends "base/crud_form.html" %}

{% block title %}
Update Survey
{% endblock %}

{% block page_title %}
Update Survey
{% endblock %}
{% block crud_content %}

<form method="post">

    {% csrf_token %}

    {% for field in form %}

    <div class="mb-3">

        <label class="form-label">

            {{ field.label }}

        </label>

        {{ field }}

        {{ field.errors }}

    </div>

    {% endfor %}

    <button
        type="submit"
        class="btn btn-primary">

        Update

    </button>

    <a
        href="{% url 'survey:survey-list' %}"
        class="btn btn-secondary">

        Cancel

    </a>

</form>

{% endblock %}
