{% extends "base/layout.html" %}

{% block title %}
Create Survey Village
{% endblock %}

{% block content %}

<div class="container-fluid">

    <div class="row justify-content-center">

        <div class="col-lg-8">

            <div class="card shadow">

                <div class="card-header">

                    <h4 class="mb-0">

                        Create Survey Village

                    </h4>

                </div>

                <div class="card-body">

                    <form method="post">

                        {% csrf_token %}

                        <div class="mb-3">

                            <label class="form-label">

                                Survey

                            </label>

                            {{ form.survey }}

                        </div>

                        <div class="mb-3">

                            <label class="form-label">

                                Village

                            </label>

                            {{ form.village }}

                        </div>

                        <div class="form-check mb-4">

                            {{ form.is_active }}

                            <label class="form-check-label">

                                Active

                            </label>

                        </div>

                        <button
                            type="submit"
                            class="btn btn-primary">

                            Save

                        </button>

                        <a
                            href="{% url 'survey:survey-village-list' %}"
                            class="btn btn-secondary">

                            Cancel

                        </a>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
